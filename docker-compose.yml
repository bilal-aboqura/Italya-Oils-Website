services:

  mongo:
    image: mongo:7.0
    container_name: italyaoils_mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: initialises the replica set on first boot (no-op if already done)
  mongo-init:
    image: mongo:7.0
    container_name: italyaoils_mongo_init
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network
    command: >
      mongosh --host italyaoils_mongo:27017 --eval
      "try { rs.status().ok === 1 ? print('RS already initialised') : rs.initiate({_id:'rs0',members:[{_id:0,host:'italyaoils_mongo:27017'}]}) } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'italyaoils_mongo:27017'}]}) }"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: italyaoils:latest
    container_name: italyaoils_app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4000:3000"
    environment:
      - NODE_ENV=production
      # All secrets are loaded from the .env file on the host — never committed to git
      - DATABASE_URL=${DATABASE_URL}
      - NEXT_PUBLIC_WHATSAPP_NUMBER=${NEXT_PUBLIC_WHATSAPP_NUMBER}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - ADMIN_SECRET_PATH=${ADMIN_SECRET_PATH}
      - SERPER_API_KEY=${SERPER_API_KEY}
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3000/api/storefront/promos?targetPage=home_hero" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongo_data:


networks:
  app-network:
    driver: bridge
